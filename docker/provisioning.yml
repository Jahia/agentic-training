# Runs on the first start of the container only
- installOrUpgradeModule: "mvn:org.jahia.modules/javascript-modules-engine/1.3.1"
# Jahia MCP server, used by AI agents to read and write content
- installOrUpgradeModule: "file:/mnt/workspace/docker/mcp-server-0.5.0-20261112.094313-18.jar"
# The For Sure module, built by "yarn build": the site import needs its template set
- installOrUpgradeModule: "js:file:/mnt/workspace/dist/package.tgz"
# The For Sure site, and the visitor accounts
- importSite: "file:/mnt/workspace/docker/forsure.zip"
- executeScript: "file:/mnt/workspace/docker/users.groovy"
